name: Update README cards

permissions:
  contents: write

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # -----------------------------
      # GitHub Stats Card
      # -----------------------------
      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=knbene&show_icons=true&count_private=true&theme=transparent&hide_border=true&disable_animations=true&card_width=450
          path: profile/stats.svg
          token: ${{ secrets.PAT }}

      # -----------------------------
      # Top Languages Card
      # -----------------------------
      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=knbene&layout=compact&count_private=true&theme=transparent&hide_border=true&disable_animations=true&card_width=450
          path: profile/languages.svg
          token: ${{ secrets.PAT }}

      # -----------------------------
      # Commit (nur wenn Änderungen existieren)
      # -----------------------------
      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet || git commit -m "Update README cards"
          git push
